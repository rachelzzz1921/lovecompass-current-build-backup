name: Lite question banks

on:
  pull_request:
    paths:
      - "backend/scripts/build_lite_question_banks.py"
      - "backend/scripts/check_lite_question_banks.py"
      - "backend/scripts/validate_slider_guidance.py"
      - "backend/app/question_bank_guidance.py"
      - "backend/data/**"
  push:
    branches: [main, master]
    paths:
      - "backend/scripts/build_lite_question_banks.py"
      - "backend/scripts/check_lite_question_banks.py"
      - "backend/scripts/validate_slider_guidance.py"
      - "backend/app/question_bank_guidance.py"
      - "backend/data/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lite JSON in sync with generator
        run: python3 scripts/check_lite_question_banks.py

      - name: All banks have slider guidance
        run: python3 scripts/validate_slider_guidance.py
