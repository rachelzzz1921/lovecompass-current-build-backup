upstream lovecompass_vercel_api {
    server lovecompass-api-backend.vercel.app:443;
}

server {
    listen 80;
    server_name 47.237.68.213;

    client_max_body_size 8m;

    location = /health {
        proxy_pass https://lovecompass_vercel_api/health;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
    }

    location /api/ {
        proxy_pass https://lovecompass_vercel_api/;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = / {
        default_type application/json;
        return 200 '{"ok":true,"service":"lovecompass-api-proxy","mirror":"http://47.237.68.213/api"}\n';
    }
}

server {
    listen 443 ssl http2;
    server_name 47-237-68-213.sslip.io;

    ssl_certificate /etc/letsencrypt/live/47-237-68-213.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-237-68-213.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location = /health {
        proxy_pass https://lovecompass_vercel_api/health;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
    }

    location /api/ {
        proxy_pass https://lovecompass_vercel_api/;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = / {
        default_type application/json;
        return 200 '{"ok":true,"service":"lovecompass-api-proxy","mirror":"https://47-237-68-213.sslip.io/api"}\n';
    }
}

server {
    listen 80;
    server_name 47-237-68-213.sslip.io;
    return 301 https://$host$request_uri;
}
