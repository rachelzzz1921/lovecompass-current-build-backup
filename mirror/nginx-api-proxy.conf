# LoveCompass API 中转 — 新加坡/香港 VPS
# /api/* → lovecompass-api-backend.vercel.app（去掉 /api 前缀）
#
# deploy-api-proxy.sh 会替换 __SERVER_NAME__

upstream lovecompass_vercel_api {
    server lovecompass-api-backend.vercel.app:443;
    keepalive 16;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 8m;

    location = /health {
        proxy_pass https://lovecompass_vercel_api/health;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
    }

    location /api/ {
        proxy_pass https://lovecompass_vercel_api/;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = / {
        default_type application/json;
        return 200 '{"ok":true,"service":"lovecompass-api-proxy","hint":"use /api/health"}\n';
    }
}
