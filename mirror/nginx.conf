# MIRROR 国内镜像 — 香港/新加坡 VPS 反向代理示例
# 将 api.* 转发到 Vercel 后端，sb.* 转发到 Supabase（同一套数据库，无需双写）
#
# 部署前替换：
#   mirror.example.com  → 你的镜像前端域名（静态站或再 proxy 到 Vercel）
#   api.mirror.example.com → API 子域
#   sb.mirror.example.com  → Supabase 代理子域
#
# SSL：建议使用 certbot / 云厂商免费证书

upstream vercel_api {
    server lovecompass-api-backend.vercel.app:443;
    keepalive 8;
}

upstream supabase_origin {
    server wjfpglsygkbpubanylug.supabase.co:443;
    keepalive 4;
}

# —— API 镜像 ——
server {
    listen 443 ssl http2;
    server_name api.mirror.example.com;

    # ssl_certificate     /etc/letsencrypt/live/api.mirror.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.mirror.example.com/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass https://vercel_api;
        proxy_ssl_server_name on;
        proxy_set_header Host lovecompass-api-backend.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# —— Supabase Auth / REST 代理（浏览器直连 supabase.co 在国内常不稳定）——
server {
    listen 443 ssl http2;
    server_name sb.mirror.example.com;

    location / {
        proxy_pass https://supabase_origin;
        proxy_ssl_server_name on;
        proxy_set_header Host wjfpglsygkbpubanylug.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# —— 前端静态站（可选：把 frontend/.output/public 或 dist 放到 /var/www/mirror）——
server {
    listen 443 ssl http2;
    server_name mirror.example.com;

    root /var/www/mirror;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name mirror.example.com api.mirror.example.com sb.mirror.example.com;
    return 301 https://$host$request_uri;
}
